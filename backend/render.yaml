services:
  - type: web
    name: petsitting-by-cathy-backend
    env: python
    region: oregon          # us-west-2 — cambiá a "frankfurt" si preferís Europa
    plan: free              # cambiá a "starter" para evitar cold starts (~$7/mes)
    rootDir: backend        # render.yaml está en /backend, el código también
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      # ── Python ────────────────────────────────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11.0"

      # ── JWT ───────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false           # se carga desde Render Dashboard > Environment

      # ── Supabase (Base de datos relacional) ───────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "uploads"
      - key: TZ
        value: "America/Argentina/Buenos_Aires"

      # ── Groq (STT + NLP) ──────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: USE_GROQ
        value: "1"            # en producción siempre Groq (no hay vLLM local)
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_VISION_MODEL_FALLBACK
        value: qwen/qwen3.8-27b
      - key: VISION_SKIP_LOCAL_FALLBACKS
        value: "1"
      - key: GROQ_VISION_TIMEOUT
        value: "10"
      - key: GROQ_RATE_LIMIT_RETRIES
        value: "1"

      # ── Escaneo: Groq primero; Ollama si falla (URL pública, ej. Tailscale Funnel) ─
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_VISION_MODEL
        value: moondream
      - key: OLLAMA_TIMEOUT
        value: "22"
      - key: OCR_SERVICE_URL
        sync: false

      # ── Qdrant Cloud (vectores / RAG) ─────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # ── Whisper local (NO se usa en Render — solo por compatibilidad) ─────
      # En producción GROQ_API_KEY está definida, así que Whisper local
      # nunca se carga. Esta variable no es necesaria en Render.
      # - key: WHISPER_MODEL
      #   value: medium

      # ── vLLM remoto (NO se usa en Render — USE_GROQ=1) ───────────────────
      # - key: VLLM_BASE_URL
      # - key: VLLM_MODEL
